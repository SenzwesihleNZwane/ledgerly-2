spring.application.name=ledgerly

server.port=${PORT:8081}

# H2 file-based database - data persists between restarts, in ./data/
spring.datasource.url=jdbc:h2:file:./data/ledgerlydb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 console at http://localhost:8080/h2-console (useful while developing)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT - CHANGE jwt.secret before deploying anywhere real
jwt.secret=ledgerly-dev-secret-key-please-change-this-before-any-real-deployment-98213
jwt.expiration.ms=86400000
